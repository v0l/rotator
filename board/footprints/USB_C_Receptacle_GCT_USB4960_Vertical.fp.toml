name = "USB_C_Receptacle_GCT_USB4960_Vertical"
description = "USB 2.0 Type-C receptacle, 16 contacts, vertical, SMT with TH shell stakes, H 6.5 mm, GCT USB4960 drawing rev A 2025-12-08 (https://gct.co/files/drawings/usb4960.pdf). Stake slots 1.2x0.6 for the drawing's 0.85x0.60, which is under the 2:1 slot length fabs drill, and they take the 4.80 +/-0.15 stake spacing at the minimum plated size; second peg round 0.75 for the drawing's 0.72x0.52 non-plated slot"
tags = ["usb", "usb-c", "2.0", "vertical"]
mount = "smd"
height = "6.5mm"

