name = "Diode_Bridge_MBS-2"
description = "MBS-2 (TO-269AA) bridge rectifier, 4.7 x 4.0 x 2.7 mm body, 2.55 mm pitch, 7.0 mm max over the leads, + and - on the -x side (Comchip CDBHM2100L-G RevB)"
tags = ["bridge", "MBS"]
mount = "smd"
height = "2.7mm"

[[pads]]
number = "1"
kind = "smd"
shape = "rect"
at = [-2.850, -1.275]
size = [1.3, 1.0]
layers = ["F.Cu", "F.Mask", "F.Paste"]

[[pads]]
number = "2"
kind = "smd"
shape = "rect"
at = [2.850, -1.275]
size = [1.3, 1.0]
layers = ["F.Cu", "F.Mask", "F.Paste"]

[[pads]]
number = "3"
kind = "smd"
shape = "rect"
at = [2.850, 1.275]
size = [1.3, 1.0]
layers = ["F.Cu", "F.Mask", "F.Paste"]

[[pads]]
number = "4"
kind = "smd"
shape = "rect"
at = [-2.850, 1.275]
size = [1.3, 1.0]
layers = ["F.Cu", "F.Mask", "F.Paste"]

[[graphics]]
kind = "rect"
layer = "F.Fab"
start = [-2.000, -2.350]
end = [2.000, 2.350]
width = 0.1

[[graphics]]
kind = "rect"
layer = "F.CrtYd"
start = [-3.750, -2.600]
end = [3.750, 2.600]
width = 0.05

[[graphics]]
kind = "line"
layer = "F.SilkS"
start = [-1.50, -2.50]
end = [1.50, -2.50]
width = 0.15

[[graphics]]
kind = "line"
layer = "F.SilkS"
start = [-1.50, 2.50]
end = [1.50, 2.50]
width = 0.15

[[graphics]]
kind = "text"
layer = "F.SilkS"
text = "+"
at = [-1.4, -1.275]
size = 1.0

[[graphics]]
kind = "text"
layer = "F.SilkS"
text = "${REFERENCE}"
at = [0, -3.4]
size = 1.0
